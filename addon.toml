# Home Assistant, as a Vitreus add-on: lights and switches from your Home Assistant in a panel out of the add-on pill.
# The lights, switches and booleans it shows are in ~/.local/share/pleamar/homeassistant/config.json (made the first time it runs; the gear in the panel opens it).

name        = "Home Assistant"
description = "Your Home Assistant lights, switches, printer and Apple TV"
author      = "datingesp-hash"
version     = "0.2"
vitreus_api = 1
repo        = "datingesp-hash/HomeAssistant-Vitreus-Addon"

scene = "homeassistant.plm"
icon  = "icon.svg"

[drawer]
width  = 520
height = 600
